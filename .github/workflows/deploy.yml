name: Deploy Worker

on:
  workflow_dispatch:
  push:
    tags:
      - "worker-v*"

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/fetch-proxy/package-lock.json
      - name: Install dependencies
        working-directory: workers/fetch-proxy
        run: npm ci
      - name: Validate before deploy
        working-directory: workers/fetch-proxy
        run: npm run typecheck && npm test
      - name: Deploy with Wrangler
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        working-directory: workers/fetch-proxy
        run: npx wrangler deploy
      - name: Explain missing deployment secrets
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "Deploy bloqueado: configure CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nos secrets do repositório."
          exit 1
